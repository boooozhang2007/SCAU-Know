name: Deploy Static Site to CDN

on:
  # 如需每日自动重新抓取公网官网并刷新部署，可取消下方定时触发器注释（北京时间 07:30）：
  # schedule:
  #   - cron: "30 23 * * *"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "data/notices.json"
      - "next.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-static.yml"
  repository_dispatch:
    types: [crawl-updated]
  workflow_dispatch:

# 连续 push 时取消旧构建，避免排队白烧额度
concurrency:
  group: deploy-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # job 级 env 才能在 step 的 if 里读到（step 级 env 求值晚于 if）
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Crawl public SCAU portals (best-effort)
        timeout-minutes: 5
        continue-on-error: true
        run: |
          if [ ! -f data/notices.json ]; then
            pnpm crawl --limit 8 --concurrency 6 --no-attachments --no-images --no-wechat --no-alerts || true
          fi
          node -e '
            const fs = require("fs");
            const p = "data/notices.json";
            if (!fs.existsSync(p)) { console.log("No crawl file; will use built-in real seed snapshot."); process.exit(0); }
            try {
              const raw = JSON.parse(fs.readFileSync(p, "utf8"));
              const list = Array.isArray(raw) ? raw : (raw.notices || []);
              console.log("CI crawl notices count:", list.length);
              if (list.length < 40) {
                console.log("Too few crawled notices (< 40); removing partial file to keep rich built-in seed snapshot.");
                fs.unlinkSync(p);
              }
            } catch (e) {
              console.log("Invalid crawl JSON; removing:", e.message);
              fs.unlinkSync(p);
            }
          '

      - name: Build pure static bundle
        run: pnpm build:static

      - name: Preflight — 文件数与体积（Pages 单次部署上限 20000 文件）
        run: |
          n=$(find out -type f | wc -l)
          echo "files=$n"
          du -sh out
          if [ "$n" -gt 19000 ]; then
            echo "::error::out/ 文件数 $n 已接近 Cloudflare Pages 20000 上限，拆分 details 或合并 JSON"
            exit 1
          fi
          big=$(find out -type f -size +25M | head -5)
          if [ -n "$big" ]; then
            echo "::error::存在超过 25MB 的单文件（Pages 上限）：$big"
            exit 1
          fi

      # Direct Upload 不触发 Pages 自身的构建流水线，不消耗 500 builds/月 配额
      - name: Deploy to Cloudflare Pages
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=scau-know --branch=main --commit-dirty=true

      # 只在失败时留产物，避免每天 12 次把 artifact 1GB 配额打满
      - name: Upload bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scau-know-static-out
          path: out
          retention-days: 1
